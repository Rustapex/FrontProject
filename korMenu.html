<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>식당 상세</title>
    <link rel="stylesheet" href="./shop.css" />
    <script src="./shop.js" defer></script>
    <style>
      .reserve-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .reserve-status-btn {
        width: auto;
        border: 1px solid #e5e7eb;
        background: #fff;
        border-radius: 999px;
        padding: 8px 10px;
        font-size: 12px;
        cursor: pointer;
        white-space: nowrap;
      }

      .reserve-status-btn:hover {
        background: #111;
        color: #fff;
        border-color: #111;
      }

      .reserve-shell {
        border: 1px solid #eceff3;
        border-radius: 12px;
        padding: 10px;
        background: #fff;
      }

      .reserve-trigger {
        width: 100%;
        border: 1px solid #dce3e8;
        background: #fff;
        border-radius: 8px;
        padding: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        cursor: pointer;
        text-align: left;
      }

      .reserve-trigger strong {
        display: block;
        font-size: 13px;
        color: #111;
      }

      .reserve-trigger span {
        display: block;
        margin-top: 2px;
        font-size: 12px;
        color: #6b7280;
      }

      .reserve-arrow {
        font-size: 16px;
        color: #6b7280;
        transition: transform 0.2s ease;
      }

      .reserve-trigger.is-open .reserve-arrow {
        transform: rotate(180deg);
      }

      .reserve-panel {
        display: none;
        margin-top: 12px;
      }

      .reserve-panel.active {
        display: block;
      }

      .reserve-group {
        margin-bottom: 12px;
      }

      .reserve-group-title {
        margin: 0 0 6px;
        font-size: 13px;
        color: #374151;
      }

      .calendar-head2 {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }

      .calendar-nav-btn {
        width: 30px;
        height: 30px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        background: #fff;
        cursor: pointer;
      }

      .calendar-month-label {
        font-size: 14px;
        font-weight: 700;
      }

      .calendar-week {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 6px;
        margin-bottom: 6px;
      }

      .calendar-week span {
        text-align: center;
        color: #6b7280;
        font-size: 12px;
      }

      #reserveSection #dateRow {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 6px;
      }

      .calendar-empty {
        height: 36px;
      }

      .calendar-day {
        width: 100%;
        height: 36px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        background: #fff;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
      }

      .calendar-day.today {
        border-color: #111;
      }

      .calendar-day.on {
        background: #111;
        color: #fff;
        border-color: #111;
      }

      .calendar-day.disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      #reserveSection #peopleRow {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        grid-template-columns: none;
      }

      #reserveSection #peopleRow .pill {
        flex: 0 0 auto;
        border-radius: 999px;
      }

      #reserveSection #timeGrid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      #reserveSection #reserveBtn {
        margin-top: 6px;
      }

      .reserve-note {
        margin: 2px 0 8px;
        font-size: 12px;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <main class="app" aria-label="식당 상세 페이지">
      <!-- 상단 가게 이미지 -->
      <section class="hero" aria-label="가게 대표 이미지">
        <!-- 이미지가 없으면 더미 이미지가 보이도록 JS에서 기본값 세팅 -->
        <img id="heroImg" alt="가게 대표 이미지" />
      </section>

      <!-- 가게 소개(이름/별점/리뷰/오는방법/가격/영업시간) -->
      <section class="card" aria-label="가게 소개">
        <h1 id="shopName" class="title">더미 식당 이름</h1>

        <div class="meta">
          <span id="rating">⭐ 4.7</span>
          <span id="reviewCount">(2,236)</span>
          <span id="category">· 양식</span>
          <span id="area">· 삼성</span>
        </div>

        <div class="info-grid">
          <div class="info-row">
            <span class="label">오는 방법</span>
            <span id="way">2호선 삼성역 5번 출구</span>
          </div>
          <div class="info-row">
            <span class="label">가격</span>
            <span id="price">점심 3~5만원 · 저녁 7~10만원</span>
          </div>
          <div class="info-row">
            <span class="label">영업</span>
            <span id="openHours">11:30~22:00 (브레이크타임 15:00~17:00)</span>
          </div>
          <div class="info-row">
            <span class="label">예약</span>
            <span id="reserveHint">날짜/시간 선택 후 예약하기</span>
          </div>
        </div>
      </section>

      <!-- 예약 부분 -->
      <section class="card" id="reserveSection" aria-label="예약">
        <div class="reserve-head">
          <h2 class="section-title">예약</h2>
          <button id="reservationBtn" class="reserve-status-btn" type="button">예약현황</button>
        </div>

        <div class="reserve-shell">
          <button id="reserveToggleBtn" class="reserve-trigger" type="button">
            <div>
              <strong>📅 날짜, 인원, 시간</strong>
              <span id="reserveSummary">날짜/시간을 선택해 주세요.</span>
            </div>
            <i class="reserve-arrow">∨</i>
          </button>

          <div id="reservePanel" class="reserve-panel">
            <!-- 날짜(가로 스크롤) -->
            <div class="reserve-group">
              <p class="reserve-group-title">날짜</p>
              <div class="calendar-head2">
                <button id="calPrevBtn" class="calendar-nav-btn" type="button">‹</button>
                <span id="calMonthLabel" class="calendar-month-label">2026년 2월</span>
                <button id="calNextBtn" class="calendar-nav-btn" type="button">›</button>
              </div>
              <div class="calendar-week">
                <span>일</span>
                <span>월</span>
                <span>화</span>
                <span>수</span>
                <span>목</span>
                <span>금</span>
                <span>토</span>
              </div>
              <div class="hscroll" id="dateRow" aria-label="날짜 선택"></div>
            </div>

            <!-- 인원 -->
            <div class="reserve-group">
              <p class="reserve-group-title">인원</p>
              <div class="grid" id="peopleRow" aria-label="인원 선택"></div>
            </div>

            <!-- 시간 -->
            <div class="reserve-group">
              <p class="reserve-group-title">시간</p>
              <div class="grid" id="timeGrid" aria-label="시간 선택"></div>
              <p class="reserve-note">
                ※ “예약 마감” 또는 “예약 완료”는 선택할 수 없습니다.
              </p>
            </div>

            <!-- 예약 버튼(본문 안) -->
            <button class="btn primary" id="reserveBtn" type="button" disabled>
              예약하기
            </button>
          </div>
        </div>
      </section>

      <!-- 메뉴 부분(텍스트 + 펼치기) -->
      <section class="card" aria-label="메뉴">
        <h2 class="section-title">메뉴</h2>

        <div class="menu-list" id="menuList">
          <!-- JS에서 더미 메뉴를 채움 -->
        </div>
      </section>

      <!-- 위치(iframe) + 주소 + 도보 -->
      <section class="card" aria-label="위치">
        <h2 class="section-title">위치</h2>

        <!-- ✅ 구글지도 iframe은 사용자가 src만 바꿔 끼우면 됨 -->
        <iframe
          id="mapFrame"
          title="지도"
          src="about:blank"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>

        <div class="info-grid">
          <div class="info-row">
            <span class="label">주소</span>
            <span id="address">서울 강남구 테헤란로 000 (더미)</span>
          </div>
          <div class="info-row">
            <span class="label">도보</span>
            <span id="walk">삼성역 5번 출구에서 도보 6분</span>
          </div>
        </div>
      </section>

      <!-- 상세정보(전화/정기휴무일) -->
      <section class="card" aria-label="상세정보">
        <h2 class="section-title">상세정보</h2>

        <div class="info-grid">
          <div class="info-row">
            <span class="label">전화</span>
            <span id="phone">02-000-0000</span>
          </div>
          <div class="info-row">
            <span class="label">정기휴무</span>
            <span id="closedDay">매주 월요일</span>
          </div>
        </div>
      </section>

      <!-- 하단 여백(고정 버튼에 가리지 않게) -->
      <div class="bottom-spacer" aria-hidden="true"></div>
    </main>

    <!-- 하단 고정 “예약하기” 버튼(찜/전화 아이콘 없음) -->
    <footer class="bottom-bar" aria-label="하단 예약하기">
      <button class="btn primary" id="bottomReserveBtn" type="button">
        예약하기
      </button>
    </footer>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const reservationBtn = document.getElementById("reservationBtn");
        const reserveBtn = document.getElementById("reserveBtn");
        const bottomReserveBtn = document.getElementById("bottomReserveBtn");

        // 예약현황 페이지 이동
        reservationBtn?.addEventListener("click", () => {
          window.location.href = "예약현황.html";
        });

        // shop.js 기본 예약 처리 대신, 예약하기.js와 같은 reservations 포맷으로 저장
        const overrideReserve = (event) => {
          event.preventDefault();
          event.stopImmediatePropagation();

          const selectedDateBtn = document.querySelector("#dateRow [data-role='date'].on");
          const selectedPeopleBtn = document.querySelector("#peopleRow .pill.on");
          const selectedTimeBtn = document.querySelector("#timeGrid .pill.on");

          if (!selectedDateBtn || !selectedPeopleBtn || !selectedTimeBtn) {
            const reservePanel = document.getElementById("reservePanel");
            const reserveToggleBtn = document.getElementById("reserveToggleBtn");
            reservePanel?.classList.add("active");
            reserveToggleBtn?.classList.add("is-open");
            document.getElementById("reserveSection")?.scrollIntoView({ behavior: "smooth", block: "start" });
            alert("날짜/인원/시간을 모두 선택해 주세요.");
            return;
          }

          if (selectedTimeBtn.disabled || selectedTimeBtn.classList.contains("disabled")) {
            alert("선택한 시간은 예약할 수 없습니다.");
            return;
          }

          const dateKey = selectedDateBtn.dataset.dateKey || "";
          const dayText = dateKey ? String(Number(dateKey.split("-")[2])) : selectedDateBtn.textContent.trim();
          const peopleText = selectedPeopleBtn.dataset.people || selectedPeopleBtn.textContent.trim();
          const timeText = selectedTimeBtn.dataset.time || selectedTimeBtn.textContent.trim();
          const name = (document.getElementById("shopName")?.textContent || "도우룸 광화문").trim();
          const areaText = (document.getElementById("area")?.textContent || "").replace("·", "").trim();
          const priceText = (document.getElementById("price")?.textContent || "").trim();
          const info = `${areaText} / ${priceText}`;
          const image = document.getElementById("heroImg")?.src || "";

          const reservation = {
            dDay: dayText,
            dateTime: `${dateKey} ${timeText} / ${peopleText}`,
            name,
            info,
            image,
            status: "예약완료",
          };

          const reservations = JSON.parse(localStorage.getItem("reservations")) || [];
          reservations.push(reservation);
          localStorage.setItem("reservations", JSON.stringify(reservations));

          // shop.js가 있으면 내부 상태에도 반영해서 다음 렌더링과 충돌하지 않게 유지
          let syncedWithShopState = false;
          if (
            typeof SHOP !== "undefined" &&
            typeof state !== "undefined" &&
            typeof slotKey === "function"
          ) {
            const internalDateKey = state.selectedDateKey || dateKey;
            const internalTime = selectedTimeBtn.dataset.time || timeText;
            state.reservedSlots.add(slotKey(SHOP.id, internalDateKey, internalTime));
            state.selectedTime = null;
            if (typeof saveReservedSlots === "function") saveReservedSlots();
            if (typeof render === "function") render();
            syncedWithShopState = true;
          }

          // fallback: shop.js 상태 동기화가 불가능한 경우 즉시 버튼 UI만 수동 반영
          if (!syncedWithShopState) {
            selectedTimeBtn.classList.remove("on");
            selectedTimeBtn.classList.add("disabled");
            selectedTimeBtn.disabled = true;
            selectedTimeBtn.textContent = `${timeText} (예약마감)`;

            const summary = document.getElementById("reserveSummary");
            if (summary) {
              summary.textContent = `${dateKey} / ${peopleText} / 예약완료`;
            }
          }

          alert("예약이 완료되었습니다.");
        };

        // 캡처 단계에서 가로채 기존 클릭 핸들러보다 먼저 실행
        reserveBtn?.addEventListener("click", overrideReserve, true);
        bottomReserveBtn?.addEventListener("click", overrideReserve, true);
      });
    </script>
  </body>
</html>
