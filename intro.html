<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>인트로 시작2</title>
    <style>
      .QRCodeWrap_container__y3UuS {
        width: 200px;
        position: absolute;
        bottom: 0;
        left: calc(50% - 470px);
        text-align: center;
      }

      .top100 {
        width: 200px;
        position: absolute;
        bottom: 20px;
        right: calc(50% - 470px);
        text-align: center;
      }

      .insta {
        display: flex;
        margin-top: 10px;
        margin-left: 30px;
      }

      .QRCodeWrap_container__y3UuS img,
      .top100 img {
        max-width: 100%;
        height: auto;
      }

      @media (max-width: 1200px) {
        .QRCodeWrap_container__y3UuS {
          left: 24px;
          bottom: 16px;
          width: 160px;
        }

        .top100 {
          right: 24px;
          bottom: 16px;
          width: 160px;
        }
      }

      @media (max-width: 768px) {
        .QRCodeWrap_container__y3UuS {
          position: fixed;
          left: 12px;
          bottom: 12px;
          width: 120px;
          margin: 0;
          z-index: 80;
        }

        .QRCodeWrap_text__6EB9z {
          font-size: 12px;
          line-height: 1.35;
          margin: 6px 0 0;
          word-break: keep-all;
        }

        .top100 {
          position: fixed;
          right: 1px;
          bottom: 12px;
          width: 120px;
          margin: 0;
          z-index: 80;
        }

        .insta {
          margin-top: 8px;
          margin-left: 0;
          justify-content: center;
        }
      }

      @media (max-width: 850px) {
        .QRCodeWrap_container__y3UuS,
        .top100 {
          display: none !important;
        }
      }
    </style>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <div class="QRCodeWrap_container__y3UuS">
      <img src="qrcode.png" alt="캐치테이블 QR" width="150" />
      <p class="QRCodeWrap_text__6EB9z">
        캐치테이블 앱으로<br />더 자세한 정보 확인하기
      </p>
    </div>

    <div class="top100">
      <a href="https://app.catchtable.co.kr/ct/search/rank/waiting"
        ><img
          src="https://www.tabling.co.kr/_next/image?url=https%3A%2F%2Fimage.tabling.co.kr%2Fuser-web-assets%2Fimages%2Flink%2Ftop100.png%3Fs%3D280x384&w=384&q=75"
          alt="캐치테이블 Top100"
          width="150"
      /></a>
      <a class="insta" href="https://www.instagram.com/catchtable_official/"
        ><img
          src="https://www.tabling.co.kr/_next/image?url=https%3A%2F%2Fimage.tabling.co.kr%2Fuser-web-assets%2Fimages%2Flink%2Finstagram.png%3Fs%3D280x292&w=384&q=75"
          alt="인스타그램"
          width="150"
      /></a>
    </div>

    <div class="page">
      <div class="app" role="application" aria-label="인트로 시작2">
        <header class="topbar">
          <a class="topbar__back" href="./index.html" aria-label="뒤로가기">←</a>
          <h1 class="topbar__title">흑백요리사2</h1>
          <button class="topbar__right" type="button" id="reservationBtn">예약현황</button>
        </header>

        <section class="hero" aria-label="상단 배너">
          <img class="hero__img" src="./intro2.jpg" alt="배너 이미지" />
        </section>

        <nav class="tabs" aria-label="카테고리 탭">
          <button class="tab is-active" type="button" data-tab="all">전체</button>
          <button class="tab" type="button" data-tab="white">백수저</button>
          <button class="tab" type="button" data-tab="black">흑수저</button>
        </nav>

        <section class="sticky-wrap" aria-label="필터 영역">
          <div class="quick" aria-label="빠른 필터">
            <button class="chip" type="button" data-chip="지역">지역</button>
            <button class="chip" type="button" data-chip="음식 종류">음식 종류</button>
            <button class="chip" type="button" data-chip="가격">가격</button>
          </div>

          <div class="selected" aria-label="선택한 조건">
            <button
              class="selected__trash"
              type="button"
              id="clearAllChips"
              aria-label="전체 해제"
            >
              🗑
            </button>
            <div class="selected__list" id="selectedChipList"></div>
          </div>
        </section>

        <main class="content" id="shopList" aria-label="식당 목록"></main>

        <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>

        <section
          class="sheet"
          id="dateTimeSheet"
          hidden
          aria-label="날짜 인원 시간 선택"
        >
          <div class="sheet__handle" aria-hidden="true"></div>

          <div class="sheet__header">
            <h3>날짜 · 인원 · 시간</h3>
            <button class="sheet__x" type="button" id="closeDateTime" aria-label="닫기">✕</button>
          </div>

          <div class="sheet__body">
            <div class="sheet-block" data-group="date">
              <div class="sheet-block__title">날짜</div>
              <div class="sheet-grid">
                <button class="pill is-on" type="button">오늘(월)</button>
                <button class="pill" type="button">내일(화)</button>
                <button class="pill" type="button">2.25(수)</button>
                <button class="pill" type="button">2.26(목)</button>
                <button class="pill" type="button">2.27(금)</button>
                <button class="pill" type="button">2.28(토)</button>
                <button class="pill" type="button">3.01(일)</button>
                <button class="pill" type="button">3.02(월)</button>
                <button class="pill" type="button">3.03(화)</button>
                <button class="pill" type="button">3.04(수)</button>
                <button class="pill" type="button">3.05(목)</button>
                <button class="pill" type="button">3.06(금)</button>
                <button class="pill" type="button">3.07(토)</button>
                <button class="pill" type="button">3.08(일)</button>
              </div>
            </div>

            <div class="sheet-block" data-group="people">
              <div class="sheet-block__title">인원</div>
              <div class="sheet-grid">
                <button class="pill is-on" type="button">2명</button>
                <button class="pill" type="button">3명</button>
                <button class="pill" type="button">4명</button>
                <button class="pill" type="button">5명</button>
                <button class="pill" type="button">6명</button>
                <button class="pill" type="button">7명</button>
                <button class="pill" type="button">8명 이상</button>
              </div>
            </div>

            <div class="sheet-block" data-group="time">
              <div class="sheet-block__title">시간</div>
              <div class="sheet-grid">
                <button class="pill is-on" type="button">18:00</button>
                <button class="pill" type="button">18:30</button>
                <button class="pill" type="button">19:00</button>
                <button class="pill" type="button">19:30</button>
                <button class="pill" type="button">20:00</button>
                <button class="pill" type="button">20:30</button>
                <button class="pill" type="button">21:00</button>
                <button class="pill" type="button">21:30</button>
              </div>
            </div>
          </div>

          <div class="sheet__footer">
            <button class="btn btn--ghost" type="button" id="sheetCloseBtn">닫기</button>
            <button class="btn btn--primary" type="button" id="sheetApplyBtn">선택 적용</button>
          </div>
        </section>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"
      defer
    ></script>
    <script src="./app.js" defer></script>
  </body>
</html>
