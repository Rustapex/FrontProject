<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마이다이닝</title>
<style>
    .res-wrap{
        width: 480px;
        box-shadow: 0 10px 30px rgba(0,0,0,.08);
        height: calc(100vh - 24px);
        background: #fff;
        border-radius: 14px;
        overflow-y: auto;
        overflow-x: hidden;
        margin: 0 auto;
        font-family: Arial, sans-serif;
    }
    #header {
        position: sticky;
        top: 0;
        background: #fff;
        padding: 0 16px;
        border-bottom: 1px solid #ddd;
        z-index: 99;
        height: 60px;
        display: flex;
        align-items: center;
        gap: 16px;
    }
    #header a {
        text-decoration: none;
        color: #000;
        font-size: 14px;
    }

    #header b {
        margin: 0;
        font-weight: bold;
        font-size: 17px;
    }
    ul{
        list-style: none;
        padding: 0 16px;
        margin: 16px 0;
        display: flex;
        gap: 16px;
    }
    ul li span{
        padding: 8px 0;
        font-weight: bold;
        cursor: pointer;
    }

    .reservation-container{
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 16px;
    }
    .reservation-card{
        border-radius: 12px;
        padding: 16px;
        background: #fff;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        position: relative;
        display: flex;
        gap: 12px;
        align-items: center;
    }
    .reservation-card img{
        width: 60px;
        height: 60px;
        border-radius: 8px;
        object-fit: cover;
        margin-bottom: 20px;
    }
    .reservation-card .d-day{
        position: absolute;
        top: 16px;
        left: 16px;
        background: #eee;
        border-radius: 50px;
        padding: 4px 10px;
        font-size: 12px;
        font-weight: bold;
    }
    .reservation-card .status{
        position: absolute;
        top: 20px;
        right: 16px;
        background: #aaa;
        color: #fff;
        border-radius: 12px;
        padding: 4px 10px;
        font-size: 12px;
    }
    .reservation-info{
        display: flex;
        flex-direction: column;
        width: 100%;
    }
    .reservation-info h3{
        margin: 0 0 4px 0;
        font-size: 16px;
        margin-top: 20px;
    }
    .reservation-info p{
        margin: 2px 0;
        font-size: 14px;
    }
    .reservation-info .date-time{
        color: #e74c3c;
        font-weight: bold;
    }
    .reservation-info button{
        margin-top: 8px;
        padding: 6px;
        border: none;
        border-radius: 8px;
        background: #f0f0f0;
        cursor: pointer;
        font-weight: bold;
    }

    .cancel-btn {
        width: 300px;
        padding: 6px 12px;
        border: none;
        border-radius: 12px;
        background: #f0f0f0;
        color: black;
        font-weight: bold;
        cursor: pointer;
        font-size: 13px;
    }
    .cancel-btn:hover {
        background: black;
        color: white;
    }
</style>
</head>
<body>
<div class="res-wrap">
    <header id="header">
        <a id="backBtn" href="#" aria-label="뒤로가기">←</a>
        <b>마이다이닝</b>
    </header>

    <ul>
        <li><span>나의 예약</span></li>
    </ul>

    <div class="reservation-container" id="myReservation">
        <!-- 예약 카드 들어가는 곳 -->
    </div>
</div>

<script>
window.addEventListener('DOMContentLoaded', () => {
    const container = document.getElementById('myReservation');
    const backBtn = document.getElementById('backBtn');
    let reservationData = JSON.parse(localStorage.getItem('reservations')) || [];

    function removeStoredSlotLock(res) {
        // main(app.js) 예약: reserved_slots_v1 배열에서 슬롯 키 제거
        const v1StoreKey = res?.slotStoreKeyV1;
        const v1SlotKey = res?.slotKeyV1;
        if (v1StoreKey && v1SlotKey) {
            let keys = [];
            try {
                keys = JSON.parse(sessionStorage.getItem(v1StoreKey)) || [];
            } catch (_) {
                keys = [];
            }
            if ((!Array.isArray(keys) || keys.length === 0)) {
                try {
                    keys = JSON.parse(localStorage.getItem(v1StoreKey)) || [];
                } catch (_) {
                    keys = [];
                }
            }
            if (Array.isArray(keys)) {
                const next = keys.filter((k) => k !== v1SlotKey);
                try {
                    sessionStorage.setItem(v1StoreKey, JSON.stringify(next));
                } catch (_) {}
                localStorage.setItem(v1StoreKey, JSON.stringify(next));
            }
            return;
        }

        const fallbackKeyByName = {
            "도우룸 광화문": "reservedSlots_doughroom_gwanghwamun",
            "유용욱 바베큐 연구소": "reservedSlots_yooyongwook_bbq",
        };

        const key = res?.slotStoreKey || fallbackKeyByName[res?.name];
        const date = res?.slotDate || res?.dDay;
        const time =
            res?.slotTime ||
            (typeof res?.dateTime === "string"
                ? (res.dateTime.split("/")?.[0]?.replace(String(date || ""), "").trim() || "")
                : "");
        if (!key || !date || !time) return;

        let slotMap = {};
        try {
            slotMap = JSON.parse(localStorage.getItem(key)) || {};
        } catch (_) {
            slotMap = {};
        }

        if (!Array.isArray(slotMap[date])) return;
        slotMap[date] = slotMap[date].filter((t) => t !== time);
        if (slotMap[date].length === 0) delete slotMap[date];
        localStorage.setItem(key, JSON.stringify(slotMap));
    }

    function renderReservations() {
        container.innerHTML = "";

        reservationData.forEach((res, index) => {
            const card = document.createElement('div');
            card.classList.add('reservation-card');

            card.innerHTML = `
                <div class="d-day">${res.dDay}</div>
                ${res.status ? `<div class="status">${res.status}</div>` : ''}
                <img src="${res.image}" alt="${res.name}">
                <div class="reservation-info">
                    <h3>${res.name}</h3>
                    <p>${res.info}</p>
                    <p class="date-time">${res.dateTime}</p>
                    ${res.status ? `<button class="cancel-btn" data-index="${index}">취소하기</button>` : ''}
                    ${res.buttonText ? `<button>${res.buttonText}</button>` : ''}
                </div>
            `;

            container.appendChild(card);
        });

        const cancelButtons = document.querySelectorAll('.cancel-btn');
        cancelButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const idx = btn.dataset.index;
                const removed = reservationData[idx];
                removeStoredSlotLock(removed);
                reservationData.splice(idx, 1);
                localStorage.setItem('reservations', JSON.stringify(reservationData));
                renderReservations();
            });
        });
    }

    renderReservations();

    backBtn.addEventListener('click', (e) => {
        e.preventDefault();

        const ref = document.referrer;

        if(ref.includes("intro.html")){
            window.location.href = "intro.html";
        } else if(ref.includes("백(양식).html")){
            window.location.href = "백(양식).html";
        } else {
            history.back();
        }
    });
});
</script>
</body>
</html>
